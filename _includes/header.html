<header>
  <div class="header-top">
    <a class="site-title" href="{{site.baseurl}}/">{{site.title}}</a>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      role="switch"
      aria-checked="false"
      aria-label="Switch to dark mode"
    >
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <g stroke-linecap="round">
              <line x1="12" y1="1.5" x2="12" y2="4"></line>
              <line x1="12" y1="20" x2="12" y2="22.5"></line>
              <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
              <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
              <line x1="1.5" y1="12" x2="4" y2="12"></line>
              <line x1="20" y1="12" x2="22.5" y2="12"></line>
              <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
              <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"
            ></path>
          </svg>
        </span>
      </span>
    </button>
  </div>
  <nav>
    <a href="{{site.baseurl}}/">home</a>
    <a href="{{site.baseurl}}/about/">about</a>
  </nav>
</header>
{% include bio.html %}
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;

    function systemTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }
    function currentTheme() {
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch (e) {}
      return stored === "light" || stored === "dark" ? stored : systemTheme();
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      btn.setAttribute("aria-checked", theme === "dark" ? "true" : "false");
      btn.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
      );
    }

    applyTheme(currentTheme());

    btn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme") || currentTheme();
      var next = current === "dark" ? "light" : "dark";
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
      applyTheme(next);
    });
  })();
</script>
