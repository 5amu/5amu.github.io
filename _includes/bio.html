<section id="bio" class="card">
  <a href="https://github.com/5amu" target="_blank" rel="noopener">
    <img class="avatar" src="{{site.data.author.dp}}" alt="{{site.data.author.name}}" width="52" height="52" />
  </a>
  <div>
    <div id="text-wrapper">{{site.data.author.description}}</div>
    <ul class="contact">
      {% for i in site.data.author.contact %}<li><a href="{{i.url}}" target="_blank" rel="noopener">{{i.title}}</a></li>{% endfor %}
    </ul>
  </div>
</section>
