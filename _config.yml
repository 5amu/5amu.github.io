title: "5amu@blog:~$"
description: "Valerio Casalino's blog on offensive security, vulnerability management, and cybersecurity research."
markdown: kramdown
url: "https://5amu.github.io"
baseurl: ""

# for atom feed and jekyll-seo-tag's JSON-LD author
author:
  name: Valerio Casalino
  email: casalinovalerio.cv [at] gmail.com
  url: "https://5amu.github.io/about/"

# used by jekyll-seo-tag for Organization/publisher logo on BlogPosting JSON-LD
logo: "https://avatars.githubusercontent.com/u/39925709?v=4"

# used by jekyll-seo-tag for the homepage/about-page JSON-LD entity (name + sameAs)
social:
  name: Valerio Casalino
  links:
    - "https://github.com/5amu"
    - "https://www.linkedin.com/in/valerio-casalino"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /p/:title/
  # jekyll-seo-tag only reads page.image (no fallback to site.logo), so the
  # avatar is duplicated here to make it the og:image/twitter:image on the
  # homepage and about page — otherwise link previews show no image at all.
  - scope:
      path: "index.md"
    values:
      image: "https://avatars.githubusercontent.com/u/39925709?v=4"
  - scope:
      path: "about.md"
    values:
      image: "https://avatars.githubusercontent.com/u/39925709?v=4"
exclude: ["sitemap.xml", "feed.xml", "LICENSE", "README.md", "CLAUDE.md", "Gemfile", "Gemfile.lock"]
