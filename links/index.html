<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Valerio Casalino's links">
  <meta name="author" content="Valerio Casalino">
  <title>@casalinovalerio</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { display: flex; min-height: 100vh; align-items: center; }
    .links-wrap { max-width: 420px; margin: 0 auto; padding: 40px 0; text-align: center; }
    .links-wrap .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 16px;
    }
    .links-wrap h1 {
      font-family: var(--font-mono);
      font-size: 1.1em;
      margin: 0 0 32px;
    }
    ul.link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    ul.link-list a {
      display: block;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.95em;
    }
    ul.link-list a:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap links-wrap">
    <a href="https://github.com/5amu" target="_blank" rel="noopener">
      <img class="avatar" src="https://avatars.githubusercontent.com/u/39925709?v=4" alt="Valerio Casalino">
    </a>
    <h1>@casalinovalerio</h1>
    <ul class="link-list">
      <li><a href="https://www.casalinovalerio.com" target="_blank" rel="noopener">Website</a></li>
      <li><a href="https://github.com/5amu" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://linkedin.com/in/valerio-casalino" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://app.hackthebox.eu/profile/118366" target="_blank" rel="noopener">HackTheBox</a></li>
      <li><a href="mailto:casalinovalerio.cv@gmail.com">Email</a></li>
    </ul>
  </div>
</body>
</html>
