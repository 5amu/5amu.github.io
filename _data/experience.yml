# Experience timeline on the homepage, drawn as a branching graph. Time runs
# left to right with one column per end date (no `end` = present, the last
# column), so each card sits where its position ended. Positions that
# overlap the one on the main line fork off it as branches, in rows below.
# Back-to-back roles at the same company (a promotion) stay on one line, and
# when two start in the same month the one running longer gets the higher
# row. Ongoing positions all end up in the present column, in parallel. It opens scrolled to the present; focusing an earlier column
# slides every position running at that moment back into it.
#
#   - role: Job title                    (required)
#     company: Company name              (required)
#     logo: /assets/img/logos/x.png      (optional, square-ish; shown on a white tile)
#     start: "2021-03"                   (YYYY-MM, quoted; shown as "Mar 2021")
#     end: "2023-06"                     (YYYY-MM, quoted; omit = present)
#     industries: [fintech, banking]     (optional; shown as #tags on the card)

