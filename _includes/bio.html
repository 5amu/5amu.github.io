<section id="bio">
  <a href="https://github.com/5amu" target="_blank" rel="noopener">
    <img class="avatar" src="{{site.data.author.dp}}" alt="{{site.data.author.name}}" />
  </a>
  <div>
    <div id="text-wrapper">{{site.data.author.description}}</div>
    <div class="contact">
      {% for i in site.data.author.contact %}<a href="{{i.url}}" target="_blank" rel="noopener">{{i.title}}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
    </div>
  </div>
</section>
