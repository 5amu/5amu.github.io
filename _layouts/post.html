<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="wrap">
      {% include header.html %}
      <main>
        <article>
          <div class="post-header">
            <div class="post-header-text">
              <h1>{{page.title}}</h1>
              <div class="post-meta">
                <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
                {% for c in page.categories %}<span class="tag">{{c}}</span>{% endfor %}
              </div>
            </div>
            {% if page.image %}
            <img class="post-header-thumb" src="{{page.image | relative_url}}" alt="" />
            {% endif %}
          </div>
          <div class="content">{{content}}</div>
        </article>
        <p><a href="{{site.baseurl}}/">&larr; back home</a></p>
      </main>
      {% include footer.html %}
    </div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: true,
        theme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
      });
      document.addEventListener("post:decrypted", () => mermaid.run());
    </script>
    {% if page.encrypted %}
    <script src="{{ '/assets/js/encrypted-post.js' | relative_url }}"{% if page.encrypted_prompt %} data-prompt="{{ page.encrypted_prompt | xml_escape }}"{% endif %}></script>
    {% endif %}
  </body>
</html>
