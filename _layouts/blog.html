<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="wrap">
      {% include header.html %}
      <main>
        {% include bio.html %}
        <hr />
        <ul class="post-list">
          {% for post in site.posts %}
          <li>
            <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
            <span class="post-title"><a href="{{site.baseurl}}{{post.url}}">{{post.title}}</a></span>
            {% if post.categories %}
            <span class="tags">{% for c in post.categories %}#{{c}} {% endfor %}</span>
            {% endif %}
          </li>
          {% endfor %}
        </ul>
      </main>
      {% include footer.html %}
    </div>
  </body>
</html>
